 name: Build Mod

  on:
    push:
      branches: [ "main", "master" ]
    pull_request:
      branches: [ "main", "master" ]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 25
          uses: actions/setup-java@v4
          with:
            java-version: '25'
            distribution: 'temurin'

        - name: Grant execute permission for gradlew
          run: |
            chmod +x RuletaChaos26/gradlew

        - name: Build with Gradle
          run: |
            cd RuletaChaos26
            ./gradlew build

        - name: Upload Mod JAR
          uses: actions/upload-artifact@v4
          with:
            name: RuletaChaos-Mod
            path: RuletaChaos26/build/libs/*.jar

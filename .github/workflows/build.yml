name: Build Mod

  on:
    push:
      branches: [ "main", "master" ]
    pull_request:
      branches: [ "main", "master" ]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'

        - name: Build with Gradle
          run: |
            cd RuletaChaos26
            chmod +x gradlew
            ./gradlew build -x test

        - name: Upload Mod JAR
          uses: actions/upload-artifact@v4
          with:
            name: RuletaChaos-Mod
            path: RuletaChaos26/build/libs/*.jar
